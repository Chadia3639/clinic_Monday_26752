spring.application.name=clinicmanagement

# ---- PostgreSQL (create the database first:  CREATE DATABASE clinic_db;) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/clinic_db
spring.datasource.username=postgres
spring.datasource.password=1234

# ---- JPA / Hibernate: generate & update the tables from the entities ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=1014
